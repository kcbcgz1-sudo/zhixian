# 知闲 · 로컬 개발 DB (PostgreSQL)
# 실행: docker compose up -d   /   중지: docker compose down
services:
  db:
    image: postgres:16-alpine
    container_name: zhixian-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhixian
      POSTGRES_PASSWORD: zhixian
      POSTGRES_DB: zhixian
    ports:
      - '5432:5432'
    volumes:
      - zhixian_pgdata:/var/lib/postgresql/data

volumes:
  zhixian_pgdata:
